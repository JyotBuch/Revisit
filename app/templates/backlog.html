{% extends "base.html" %}
{% block title %}Research Newsletter — Revisit{% endblock %}
{% block content %}
<div class="toolbar">
  <div><h1 style="margin:0">Your research newsletter</h1><p class="meta">Fresh research from the passages you marked Research.</p></div>
  <button class="btn btn-primary btn-sm" id="run" onclick="runNow()">Run now</button>
</div>
<div id="alert-area"></div><div id="issues"><p class="loading">Loading…</p></div>
{% endblock %}
{% block scripts %}
<script>
const safe = value => String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
async function loadIssues() {
  const area = document.getElementById('issues');
  try {
    const issues = await api('GET', '/api/v1/newsletters');
    if (!issues.length) { area.innerHTML = '<div class="card"><h2>No issue yet</h2><p>Mark passages as Research in the extension, then click Run now. Captures stay saved without entering the research newsletter.</p></div>'; return; }
    area.innerHTML = issues.map(issue => `<article class="card">
      <div class="meta">${fmtDate(issue.created_at)}</div><h2>${safe(issue.subject)}</h2><p>${safe(issue.introduction)}</p>
      ${issue.items.map(item => `<section style="margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--border)">
        <h3>${safe(item.title)}</h3><blockquote style="margin:.7rem 0;padding:.7rem 1rem;border-left:3px solid var(--accent);color:var(--text-muted)">${safe(item.saved_text)}</blockquote>
        <div class="section-label">What the research says</div><div class="body-text">${safe(item.research_summary)}</div>
        ${item.sources.length ? `<div class="field-block"><div class="section-label">Sources</div><ul class="resource-list">${item.sources.map(source => `<li><a href="${safe(source.url)}" target="_blank" rel="noopener noreferrer">${safe(source.title)}</a></li>`).join('')}</ul></div>` : ''}
        <div class="field-block"><div class="section-label">Keep thinking</div><div class="body-text">${safe(item.next_question)}</div></div>
      </section>`).join('')}</article>`).join('');
  } catch (error) { area.innerHTML = `<div class="alert alert-error">${safe(error.message)}</div>`; }
}
async function runNow() {
  const button = document.getElementById('run'); button.disabled = true;
  try { const job = await api('POST', '/api/v1/jobs/research'); document.getElementById('alert-area').innerHTML = `<div class="alert alert-info">Research queued (${safe(job.id.slice(0,8))}). Refresh in a few minutes.</div>`; }
  catch (error) { document.getElementById('alert-area').innerHTML = `<div class="alert alert-error">${safe(error.message)}</div>`; }
  finally { button.disabled = false; }
}
loadIssues();
</script>
{% endblock %}
