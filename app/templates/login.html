<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Revisit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f8f9fa;
      --surface: #ffffff;
      --border: #dee2e6;
      --text: #212529;
      --text-muted: #6c757d;
      --accent: #4361ee;
      --accent-hover: #3451d1;
      --danger: #e63946;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.06);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2rem 2.25rem;
      width: 100%;
      max-width: 360px;
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: .25rem;
    }

    .tagline {
      font-size: .85rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
    }

    label {
      display: block;
      font-size: .875rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: .3rem;
      margin-top: 1rem;
    }

    label:first-of-type { margin-top: 0; }

    input {
      width: 100%;
      padding: .55rem .75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: .9rem;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }

    input:focus { border-color: var(--accent); background: var(--surface); }

    .error {
      margin-top: 1rem;
      padding: .6rem .85rem;
      background: #fde8e9;
      color: var(--danger);
      border: 1px solid #f5b7bb;
      border-radius: var(--radius);
      font-size: .875rem;
      display: none;
    }

    .error.visible { display: block; }

    .btn {
      display: block;
      width: 100%;
      margin-top: 1.25rem;
      padding: .6rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: .95rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="brand">Revisit</div>
    <div class="tagline">Sign in to your personal research pipeline</div>

    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" type="text" name="username" autocomplete="username" autofocus required />

      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" required />

      <div id="error" class="error"></div>

      <button class="btn" type="submit" id="submit-btn">Sign in</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const resp = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        if (resp.ok) {
          window.location.href = '/app/capture';
        } else {
          errorEl.textContent = 'Incorrect username or password.';
          errorEl.classList.add('visible');
        }
      } catch {
        errorEl.textContent = 'Network error — is the server running?';
        errorEl.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
