## Render Blueprint — deploys the Revisit FastAPI app + managed Postgres.
## https://render.com/docs/blueprint-spec
##
## Usage:
##   1. Push this repo to GitHub.
##   2. In the Render dashboard → New → Blueprint → select this repo.
##   3. Set the four secret env vars marked `sync: false` in the dashboard
##      (APP_USERNAME, APP_PASSWORD, OPENAI_API_KEY, and optionally
##      SEARCH_API_KEY).
##   4. Deploy — Render runs `alembic upgrade head` then starts gunicorn.

services:
  - type: web
    name: revisit
    runtime: python
    plan: free           # upgrade to "starter" for persistent DB and no spin-down
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:$PORT --timeout 120 app.main:app
    healthCheckPath: /health
    envVars:
      # Injected automatically from the database below — do not set manually.
      - key: DATABASE_URL
        fromDatabase:
          name: revisit-db
          property: connectionString

      # Auth — required in production.
      - key: AUTH_ENABLED
        value: true
      - key: APP_USERNAME
        sync: false   # set in Render dashboard
      - key: APP_PASSWORD
        sync: false   # set in Render dashboard

      # OpenAI — optional; embeddings + LLM card generation fall back to
      # rule-based/fake if unset.
      - key: OPENAI_API_KEY
        sync: false   # set in Render dashboard
      - key: OPENAI_REVISIT_CARD_MODEL
        value: gpt-4o-mini

      # Web search for related resources — optional.
      # Set SEARCH_PROVIDER=brave and SEARCH_API_KEY=<key> to enable real search.
      - key: SEARCH_PROVIDER
        value: ""
      - key: SEARCH_API_KEY
        sync: false   # set in Render dashboard if using real search

      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: revisit-db
    databaseName: revisit
    user: revisit
    plan: free   # free plan expires after 90 days — upgrade to "starter" for persistence
