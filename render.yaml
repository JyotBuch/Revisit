## Free testing Blueprint — FastAPI + temporary managed Postgres.
## https://render.com/docs/blueprint-spec
##
## Usage:
##   1. Push this repo to GitHub.
##   2. In the Render dashboard → New → Blueprint → select this repo.
##   3. Set the secret env vars marked `sync: false` in the dashboard
##      (Google OAuth, extension origin, OPENAI_API_KEY, and TAVILY_API_KEY).
##   4. Deploy — startup runs `alembic upgrade head` then starts gunicorn.

services:
  - type: web
    name: revisit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start.sh
    healthCheckPath: /health
    envVars:
      # Injected automatically from the database below — do not set manually.
      - key: DATABASE_URL
        fromDatabase:
          name: revisit-db
          property: connectionString

      # Auth — required in production.
      - key: AUTH_ENABLED
        value: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: ALLOWED_EXTENSION_ORIGINS
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: GOOGLE_WEB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_WEB_REDIRECT_URI
        sync: false
      - key: GOOGLE_EXTENSION_CLIENT_ID
        sync: false
      # Free-tier testing: process Run now tasks after the HTTP response.
      # This is not durable across process restarts; use app.worker in production.
      - key: INLINE_RESEARCH_JOBS
        value: true

      # OpenAI — optional; embeddings + LLM card generation fall back to
      # rule-based/fake if unset.
      - key: OPENAI_API_KEY
        sync: false   # set in Render dashboard
      - key: OPENAI_REVISIT_CARD_MODEL
        value: gpt-4o-mini

      # Web search for related resources — optional.
      # Set SEARCH_PROVIDER=tavily and TAVILY_API_KEY=<key> to enable real search.
      # Without both set, retrieval falls back to a fake local provider.
      - key: SEARCH_PROVIDER
        value: tavily
      - key: TAVILY_API_KEY
        sync: false   # set in Render dashboard if using real search

      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: revisit-db
    databaseName: revisit
    user: revisit
    plan: free
